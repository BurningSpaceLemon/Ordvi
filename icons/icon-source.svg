<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Ordvi translation icon">
  <defs>
    <linearGradient id="bg" x1="70" y1="45" x2="450" y2="465" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d6a59"/>
      <stop offset=".55" stop-color="#06483d"/>
      <stop offset="1" stop-color="#022f28"/>
    </linearGradient>
    <linearGradient id="cyan" x1="310" y1="135" x2="225" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#72eee7"/>
      <stop offset=".55" stop-color="#42d8d1"/>
      <stop offset="1" stop-color="#16aaa8"/>
    </linearGradient>
    <linearGradient id="ivory" x1="105" y1="145" x2="320" y2="335" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".75" stop-color="#f8f7f0"/>
      <stop offset="1" stop-color="#dce9e3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#001d18" flood-opacity=".34"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="#032f28"/>
  <rect x="8" y="8" width="496" height="496" rx="98" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- upper / left speech-loop -->
    <path d="M116 311
             C88 232 112 166 170 123
             C215 89 278 82 332 99
             C371 111 397 136 401 168
             C405 197 391 223 365 241
             C345 255 320 262 292 263
             L292 218
             C315 216 335 210 348 199
             C361 188 365 174 359 162
             C350 144 324 136 291 136
             C244 136 198 151 167 181
             C136 211 128 254 142 294
             L159 278
             L171 347
             L103 337
             Z"
          fill="url(#ivory)"/>

    <!-- top arrow head -->
    <path d="M286 137 L329 101 Q337 94 345 101 L392 145 Q399 152 392 160 L347 205 Q339 213 331 206 L288 169 Q280 162 280 153 Q280 144 286 137Z"
          fill="url(#ivory)"/>

    <!-- lower / right speech-loop -->
    <path d="M396 201
             C424 280 400 346 342 389
             C297 423 234 430 180 413
             C141 401 115 376 111 344
             C107 315 121 289 147 271
             C167 257 192 250 220 249
             L220 294
             C197 296 177 302 164 313
             C151 324 147 338 153 350
             C162 368 188 376 221 376
             C268 376 314 361 345 331
             C376 301 384 258 370 218
             L353 234
             L341 165
             L409 175
             Z"
          fill="url(#cyan)"/>

    <!-- bottom arrow head -->
    <path d="M226 375 L183 411 Q175 418 167 411 L120 367 Q113 360 120 352 L165 307 Q173 299 181 306 L224 343 Q232 350 232 359 Q232 368 226 375Z"
          fill="url(#cyan)"/>
  </g>

  <!-- subtle inner highlight -->
  <path d="M111 172 C146 91 255 62 344 91" fill="none" stroke="#7cf5e3" stroke-opacity=".16" stroke-width="5" stroke-linecap="round"/>
</svg>
