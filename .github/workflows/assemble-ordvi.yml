name: Assemble Ordvi source

on:
  push:
    branches: [main]
    paths:
      - '.ordvi-parts/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assemble and expand PWA
        shell: bash
        run: |
          cat .ordvi-parts/part-* > /tmp/ordvi.b64
          base64 --decode /tmp/ordvi.b64 > /tmp/ordvi.zip
          unzip -t /tmp/ordvi.zip
          unzip -o /tmp/ordvi.zip
          rm -rf .ordvi-parts ordvi-pwa.zip
          rm -f .github/workflows/expand-ordvi.yml
          rm -f .github/workflows/assemble-ordvi.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Ordvi PWA source"
          git push
