name: Generate Ordvi icons

on:
  push:
    branches: [main]
    paths:
      - 'icons/icon-source.svg'
      - '.github/workflows/generate-icons.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin

      - name: Generate PWA icon sizes
        shell: bash
        run: |
          rsvg-convert -w 512 -h 512 icons/icon-source.svg -o icons/icon-512.png
          rsvg-convert -w 192 -h 192 icons/icon-source.svg -o icons/icon-192.png
          rsvg-convert -w 180 -h 180 icons/icon-source.svg -o icons/apple-touch-icon.png
          rsvg-convert -w 512 -h 512 icons/icon-source.svg -o icons/maskable-512.png

      - name: Commit generated icon assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-512.png icons/icon-192.png icons/apple-touch-icon.png icons/maskable-512.png
          git diff --cached --quiet && exit 0
          git commit -m "Regenerate Ordvi icon assets"
          git push
