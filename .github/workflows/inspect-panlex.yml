name: Inspect PanLex pack layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-panlex.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect target pair filenames
        shell: bash
        run: |
          curl -L --fail --retry 3             https://raw.githubusercontent.com/acoli-repo/acoli-dicts/master/stable/panlex/biling-tsv/panlex-20191001-csv-tsv/en.zip             -o /tmp/en.zip
          mkdir -p /tmp/panlex
          unzip -q /tmp/en.zip -d /tmp/panlex

          echo "=== F* candidates ==="
          find /tmp/panlex/en -maxdepth 1 -type f -printf '%f\n' | sort | grep '^en-f' | head -100 || true
          echo "=== I* candidates ==="
          find /tmp/panlex/en -maxdepth 1 -type f -printf '%f\n' | sort | grep '^en-i' | head -100 || true
          echo "=== R* candidates ==="
          find /tmp/panlex/en -maxdepth 1 -type f -printf '%f\n' | sort | grep '^en-r' | head -100 || true
          echo "=== Chinese candidates ==="
          find /tmp/panlex/en -maxdepth 1 -type f -printf '%f\n' | sort | grep -E '^en-(cmn|zh|zho|chi|yue|wuu)' || true
